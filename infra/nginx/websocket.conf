# infra/nginx/websocket.conf
#
# The map that makes WebSocket proxying safe, plus the shared proxy headers.
# Included from the http {} block — see README.md.
#
# ── Why a map and not a literal "Connection: upgrade" ───────────────────────
#
# The obvious version hardcodes the header:
#
#     proxy_set_header Connection "upgrade";
#
# That works for WebSocket requests and quietly breaks everything else routed
# through the same location. Ordinary HTTP requests arrive with no `Upgrade`
# header, and telling the upstream to upgrade a connection nobody asked to
# upgrade produces confusing failures and defeats keepalive between nginx and
# the upstream.
#
# The map makes `Connection` depend on whether the client actually asked:
#
#     Upgrade: websocket  ->  Connection: upgrade
#     (absent)            ->  Connection: close
#
# This is the form nginx's own documentation recommends, and it means the same
# location block can carry both a REST call and a socket without a second vhost.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Headers every proxied request needs, WebSocket or not.
#
# X-Forwarded-For matters here beyond logging: the API's rate limiters and the
# Security Center's "failed logins from N addresses" read the client IP, and
# without this every request on the platform appears to come from the Docker
# bridge gateway — one address, so per-IP limits become global limits and the
# threat panel sees one attacker.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# HTTP/1.1 is required for an Upgrade to be legal at all; nginx proxies with
# 1.0 by default, which silently makes WebSocket impossible.
proxy_http_version 1.1;
