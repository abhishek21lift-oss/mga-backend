# infra/nginx/myptstudio.conf
#
# The reverse proxy in front of MY PT STUDIO.
#
# Two names, one VPS, two containers:
#
#   myptstudio.com / www.myptstudio.com  ->  frontend container  127.0.0.1:3000
#   api.myptstudio.com                   ->  backend container   127.0.0.1:5000
#
# Both containers bind to loopback only (see docker-compose.yml), so nginx is
# the only way in. Nothing here should ever proxy to 0.0.0.0.
#
# ── The one thing that is easy to get wrong ─────────────────────────────────
#
# Ordinary API calls do NOT come to api.myptstudio.com. The browser calls
# /api/* on the frontend origin and the frontend container's Next.js rewrite
# forwards them. That hop is an HTTP proxy and does not carry a WebSocket
# Upgrade, so realtime traffic addresses api.myptstudio.com directly:
#
#   API calls    browser -> nginx -> frontend -> Next rewrite -> backend
#   WebSocket    browser -> nginx ---------------------------> backend
#
# Which is why `api.myptstudio.com` needs a real WebSocket location and the
# frontend vhost does not.
#
# ── This file is a TEMPLATE, not a drop-in ──────────────────────────────────
#
# Certificate paths are certbot's defaults and the ports match this repo's
# compose file. Diff against the live config before replacing anything, and
# never reload without `nginx -t` first. See README.md.

# ── Redirect plain HTTP ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name myptstudio.com www.myptstudio.com api.myptstudio.com;

    # Leave this reachable over HTTP or certbot renewal fails.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ── Frontend ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myptstudio.com www.myptstudio.com;

    ssl_certificate     /etc/letsencrypt/live/myptstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myptstudio.com/privkey.pem;

    # Face-recognition models are several MB; uploads carry progress photos and
    # PAR-Q documents. The default 1m rejects both with a bare 413.
    client_max_body_size 25m;

    # Security headers are NOT set here. src/lib/security-headers.js in the
    # frontend repo is the single source of truth and Next.js applies them —
    # setting them in two places is how they drift and how a CSP ends up
    # silently weaker than the file that claims to define it.

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/myptstudio-proxy.conf;

        # Next.js dev-style HMR and React server components can upgrade; the
        # map means this is inert for ordinary requests.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── Backend API ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.myptstudio.com;

    ssl_certificate     /etc/letsencrypt/live/api.myptstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.myptstudio.com/privkey.pem;

    client_max_body_size 25m;

    # ── Command Center realtime stream ──────────────────────────────────────
    #
    # Declared BEFORE the catch-all `location /` so it wins: nginx prefers the
    # longest literal prefix, so ordering is not strictly required here, but
    # keeping it first makes the intent obvious to the next reader.
    location /api/command-center/stream {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/myptstudio-proxy.conf;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The default proxy_read_timeout is 60s. A console left open on a quiet
        # night sends nothing for minutes at a time, so at 60s the socket would
        # drop roughly every minute and the client would spend its life
        # reconnecting — which reads as "the realtime feature is flaky" and is
        # actually this line.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffering a stream defeats the point of streaming it.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/myptstudio-proxy.conf;

        # PDF generation (invoices, PAR-Q) and AI routing can exceed the 60s
        # default. Deliberately NOT the 3600s used for the stream: an ordinary
        # request that hangs for an hour is a leak, not a long poll.
        proxy_read_timeout 120s;
    }

    # Uploads are served by the API. Same origin as the API on purpose, so the
    # signed-URL logic in lib/fileStorage.js needs no second host.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/myptstudio-proxy.conf;
    }
}
