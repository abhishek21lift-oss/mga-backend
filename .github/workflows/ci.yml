name: CI — Lint · Test · Audit

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  # Manual re-run.
  #
  # GitHub does not trigger `push` workflows for pushes authenticated with an
  # app or bot token — it is a recursion guard. So a commit landed that way
  # gets no CI run at all, and since deploy.yml now waits on CI's conclusion,
  # that means no deploy either: the commit is on main and nothing happens.
  # This button is how such a commit gets a result without an empty commit
  # pushed by hand.
  workflow_dispatch:

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The backlog is cleared, so the ceiling is zero: any new warning fails
        # CI immediately rather than being absorbed into a budget.
        run: npm run lint -- --max-warnings=0

  # ── Job 2: Unit tests ──────────────────────────────────────────────
  test:
    name: Jest
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-real
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_619

    services:
      postgres:
        # Matches production (PostgreSQL 17.6). CI previously ran 15, so two
        # major versions of behaviour — collation, RLS, planner, and the
        # extensions available — went untested until deploy.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_619
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ── Job 3: Security audit ──────────────────────────────────────────
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit dependencies
        # Clean as of the brace-expansion override in package.json. When a new
        # advisory lands, prefer `overrides` for a transitive dependency over
        # loosening this threshold.
        run: npm audit --audit-level=high

  # ── Job 4: Fresh-database bootstrap ────────────────────────────────
  #
  # Proves an empty database can still be built from src/db/schema.sql plus
  # the migration chain, twice, identically. The regression this guards
  # against is silent: a migration that depends on state only an
  # already-migrated database has. Every deployment to date had that state,
  # so nothing noticed until an empty database was tried and the first file
  # failed with 42P01 relation "clients" does not exist.
  #
  # pgvector/pgvector:pg17 rather than postgres:17 because three migrations
  # need CREATE EXTENSION vector and the stock image cannot provide it.
  # Production (Supabase) has pgvector, so testing without it would verify a
  # database nobody runs.
  bootstrap:
    name: DB bootstrap (PG17 + pgvector)
    runs-on: ubuntu-latest
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # /api/health reports 503 unless BOTH Postgres and Redis answer (see
      # lib/health.js). That is the real contract a load balancer probes, so
      # the boot check below is given a real Redis rather than being relaxed
      # to accept a degraded response.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify fresh-database bootstrap
        run: node scripts/db-bootstrap-verify.js

      # A schema the application cannot actually boot against is not a
      # verified bootstrap. This starts the real server against the database
      # the step above built from nothing, waits for /api/health, and reports
      # what it answered.
      - name: Boot the application against the fresh database
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mga_bootstrap_a?sslmode=disable
          JWT_SECRET: ci-boot-check-secret-not-a-real-credential-000000
          FRONTEND_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
          PORT: '5000'
          # Workers would drain queues against a throwaway Redis for no
          # benefit and add noise to the boot window.
          RUN_WORKERS: '0'
        run: |
          node src/server.js & echo $! > /tmp/server.pid
          for i in $(seq 1 45); do
            body=$(curl -fsS --max-time 5 http://127.0.0.1:5000/api/health 2>/dev/null) && {
              echo "health responded after ${i}s:"; echo "$body"
              { echo "## Application boot"; echo; echo '```json'; echo "$body"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              kill "$(cat /tmp/server.pid)" 2>/dev/null || true
              exit 0
            }
            sleep 1
          done
          echo "server did not answer /api/health within 45s"
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          exit 1

  # ── Job 5: RLS tenant isolation ────────────────────────────────────
  #
  # Runs as app_tenant (LOGIN, NOSUPERUSER, NOBYPASSRLS), which is the only
  # way this proves anything. The application has always connected as a role
  # that bypasses RLS, so every policy migration 157 generates has been
  # decorative — present in the catalogue, never consulted. A suite run as
  # postgres would pass while testing nothing, because postgres owns the
  # tables and ignores their policies.
  rls:
    name: RLS tenant isolation (app_tenant)
    runs-on: ubuntu-latest
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tenant isolation as app_tenant
        run: node scripts/rls-security-verify.js
