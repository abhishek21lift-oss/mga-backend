name: CI — Lint · Test · Audit

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  # Manual re-run.
  #
  # GitHub does not trigger `push` workflows for pushes authenticated with an
  # app or bot token — it is a recursion guard. So a commit landed that way
  # gets no CI run at all, and since deploy.yml now waits on CI's conclusion,
  # that means no deploy either: the commit is on main and nothing happens.
  # This button is how such a commit gets a result without an empty commit
  # pushed by hand.
  workflow_dispatch:

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The backlog is cleared, so the ceiling is zero: any new warning fails
        # CI immediately rather than being absorbed into a budget.
        run: npm run lint -- --max-warnings=0

  # ── Job 2: Unit tests ──────────────────────────────────────────────
  test:
    name: Jest
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-real
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_619

    services:
      postgres:
        # Matches production (PostgreSQL 17.6). CI previously ran 15, so two
        # major versions of behaviour — collation, RLS, planner, and the
        # extensions available — went untested until deploy.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_619
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ── Job 3: Security audit ──────────────────────────────────────────
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit dependencies
        # Clean as of the brace-expansion override in package.json. When a new
        # advisory lands, prefer `overrides` for a transitive dependency over
        # loosening this threshold.
        run: npm audit --audit-level=high

  # ── Job 4: Fresh-database bootstrap ────────────────────────────────
  #
  # Proves an empty database can still be built from src/db/schema.sql plus
  # the migration chain, twice, identically. The regression this guards
  # against is silent: a migration that depends on state only an
  # already-migrated database has. Every deployment to date had that state,
  # so nothing noticed until an empty database was tried and the first file
  # failed with 42P01 relation "clients" does not exist.
  #
  # pgvector/pgvector:pg17 rather than postgres:17 because three migrations
  # need CREATE EXTENSION vector and the stock image cannot provide it.
  # Production (Supabase) has pgvector, so testing without it would verify a
  # database nobody runs.
  bootstrap:
    name: DB bootstrap (PG17 + pgvector)
    runs-on: ubuntu-latest
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # /api/health reports 503 unless BOTH Postgres and Redis answer (see
      # lib/health.js). That is the real contract a load balancer probes, so
      # the boot check below is given a real Redis rather than being relaxed
      # to accept a degraded response.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify fresh-database bootstrap
        run: node scripts/db-bootstrap-verify.js

      # A schema the application cannot actually boot against is not a
      # verified bootstrap. This starts the real server against the database
      # the step above built from nothing, waits for /api/health, and reports
      # what it answered.
      - name: Boot the application against the fresh database
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mga_bootstrap_a?sslmode=disable
          JWT_SECRET: ci-boot-check-secret-not-a-real-credential-000000
          FRONTEND_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
          PORT: '5000'
          # Workers would drain queues against a throwaway Redis for no
          # benefit and add noise to the boot window.
          RUN_WORKERS: '0'
        run: |
          node src/server.js & echo $! > /tmp/server.pid
          for i in $(seq 1 45); do
            body=$(curl -fsS --max-time 5 http://127.0.0.1:5000/api/health 2>/dev/null) && {
              echo "health responded after ${i}s:"; echo "$body"
              { echo "## Application boot"; echo; echo '```json'; echo "$body"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              kill "$(cat /tmp/server.pid)" 2>/dev/null || true
              exit 0
            }
            sleep 1
          done
          echo "server did not answer /api/health within 45s"
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          exit 1

  # ── Job 5: RLS tenant isolation ────────────────────────────────────
  #
  # Runs as app_tenant (LOGIN, NOSUPERUSER, NOBYPASSRLS), which is the only
  # way this proves anything. The application has always connected as a role
  # that bypasses RLS, so every policy migration 157 generates has been
  # decorative — present in the catalogue, never consulted. A suite run as
  # postgres would pass while testing nothing, because postgres owns the
  # tables and ignores their policies.
  rls:
    name: RLS tenant isolation (app_tenant)
    runs-on: ubuntu-latest
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # /api/health is 503 without Redis, and the enforcement step below
      # probes it.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tenant isolation as app_tenant
        run: node scripts/rls-security-verify.js

      # Enforcement readiness (Phase 5B part H/J).
      #
      # Everything above proves the policies work when a non-bypassing role
      # queries the database directly. It does not prove the *application* can
      # run that way, and that is the step TENANT-RLS-PLAN.md warns is the one
      # that "finds what the app quietly relied on". Booting the real server as
      # app_tenant with TENANT_RLS_ENFORCE=on is how that gets found here
      # rather than on a staging cutover.
      #
      # Staging only. Nothing about this touches production.
      - name: Boot as app_tenant with RLS enforcement on
        env:
          NODE_ENV: test
          JWT_SECRET: ci-rls-enforce-secret-not-a-real-credential-00000
          FRONTEND_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
          PORT: '5001'
          RUN_WORKERS: '0'
          TENANT_RLS_ENFORCE: 'on'
        run: |
          set -o pipefail
          PW=$(node -e "console.log(require('crypto').randomBytes(18).toString('hex'))")
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE app_tenant WITH LOGIN PASSWORD '$PW'"
          # Runtime traffic on the unprivileged role; migrations on the
          # privileged one. Without the split the server cannot start at all —
          # app_tenant has no CREATE on schema public, so the boot-time
          # migration check fails with "permission denied for schema public".
          export DATABASE_URL="postgresql://app_tenant:$PW@localhost:5432/mga_rls_test?sslmode=disable"
          export MIGRATION_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/mga_rls_test?sslmode=disable"

          node src/server.js > /tmp/enforce.log 2>&1 & echo $! > /tmp/enforce.pid
          for i in $(seq 1 45); do
            body=$(curl -fsS --max-time 5 http://127.0.0.1:5001/api/health 2>/dev/null) && {
              echo "healthy as app_tenant after ${i}s: $body"
              {
                echo "## Enforcement readiness"; echo
                echo "Role: app_tenant (NOBYPASSRLS) · TENANT_RLS_ENFORCE=on"; echo
                echo '```json'; echo "$body"; echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              kill "$(cat /tmp/enforce.pid)" 2>/dev/null || true
              exit 0
            }
            sleep 1
          done
          echo "::error title=RLS enforcement::server did not become healthy as app_tenant with TENANT_RLS_ENFORCE=on"
          # Surface the cause as annotations. The log itself needs repository
          # admin rights to download, and "did not become healthy" on its own
          # says nothing about which privilege or context was missing.
          grep -iE "permission denied|migration attempt|fatal|FATAL|role .* does not exist|denied for" /tmp/enforce.log \
            | tail -6 | while IFS= read -r line; do
                echo "::error title=RLS enforcement cause::${line}"
              done || true
          { echo "## Enforcement readiness — FAILED"; echo; echo '```'; tail -40 /tmp/enforce.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -40 /tmp/enforce.log || true
          kill "$(cat /tmp/enforce.pid)" 2>/dev/null || true
          exit 1

  # ── Job 6: API IDOR tenant isolation ───────────────────────────────
  #
  # The database suite proves policies hold when SQL runs as app_tenant. It
  # cannot see the layer above: a route that reads through a service path,
  # aggregates without a tenant filter, or simply trusts an id from the URL.
  # This drives the real Express app over HTTP with real tokens from the real
  # login route, so each request travels auth → tenant resolution →
  # authorization → RLS.
  #
  # Separate from the `rls` job on purpose. Folding them together would let a
  # database pass mask an API failure in a single green tick, and these answer
  # different questions.
  api-idor:
    name: API IDOR (app_tenant + enforcement)
    runs-on: ubuntu-latest
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      API_IDOR_DB: mga_idor_test
      # Throwaway, deterministic, and not a credential to anything that exists.
      JWT_SECRET: ci-api-idor-secret-not-a-real-credential-000000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
      RUN_WORKERS: '0'
      COMMAND_CENTER_STREAM: 'off'
      TENANT_RLS_ENFORCE: 'on'

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Preconditions, asserted rather than assumed. Each of these failing
      # would otherwise surface as a confusing suite error much later.
      - name: Verify PostgreSQL 17 and pgvector
        run: |
          set -euo pipefail
          PSQL="psql postgresql://postgres:postgres@localhost:5432/postgres -tAX -v ON_ERROR_STOP=1"
          MAJOR=$($PSQL -c "SHOW server_version_num" | cut -c1-2)
          echo "server_version_num major: $MAJOR"
          [ "$MAJOR" -ge 17 ] || { echo "::error::PostgreSQL 17 required, got major $MAJOR"; exit 1; }
          HAVE=$($PSQL -c "SELECT count(*) FROM pg_available_extensions WHERE name='vector'")
          [ "$HAVE" = "1" ] || { echo "::error::pgvector is not available in this image"; exit 1; }
          echo "pgvector available"

      - name: Bootstrap the database with the privileged role
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mga_idor_test?sslmode=disable
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mga_idor_test?sslmode=disable
        run: |
          set -euo pipefail
          PSQL="psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1"
          $PSQL -c "DROP DATABASE IF EXISTS mga_idor_test WITH (FORCE)"
          $PSQL -c "CREATE DATABASE mga_idor_test"
          # Supabase provides these; a plain PostgreSQL must be given them or
          # 27 migrations fail with 42704 role "anon" does not exist.
          for r in anon authenticated service_role; do
            $PSQL -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='$r') THEN CREATE ROLE $r NOLOGIN; END IF; END \$\$;"
          done
          node src/db/migrate.js

      - name: Give app_tenant a password and verify it cannot bypass RLS
        run: |
          set -euo pipefail
          PW=$(node -e "console.log(require('crypto').randomBytes(18).toString('hex'))")
          echo "APP_TENANT_PW=$PW" >> "$GITHUB_ENV"
          PSQL="psql postgresql://postgres:postgres@localhost:5432/mga_idor_test -tAX -v ON_ERROR_STOP=1"
          $PSQL -c "ALTER ROLE app_tenant WITH LOGIN PASSWORD '$PW'"
          # Asked as a count of privileges held rather than by string-matching
          # the flags: psql renders booleans as t/f on their own but as
          # true/false through ||, so an equality check against "f f f f f"
          # failed against a perfectly correct role. Counting is immune to how
          # the value happens to be formatted.
          HELD=$($PSQL -c "SELECT rolsuper::int + rolbypassrls::int + rolcreatedb::int + rolcreaterole::int + rolreplication::int FROM pg_roles WHERE rolname='app_tenant'")
          DETAIL=$($PSQL -c "SELECT 'super='||rolsuper||' bypassrls='||rolbypassrls||' createdb='||rolcreatedb||' createrole='||rolcreaterole||' replication='||rolreplication FROM pg_roles WHERE rolname='app_tenant'")
          echo "app_tenant: $DETAIL"
          [ -n "$HELD" ] || { echo "::error::app_tenant role not found"; exit 1; }
          [ "$HELD" -eq 0 ] || { echo "::error::app_tenant holds $HELD privilege(s) it must not have — $DETAIL"; exit 1; }

      # The suite refuses to report IDOR results unless each session can first
      # reach its OWN tenant, so a broken login fails the job rather than
      # turning every 401 into a passing "denial".
      - name: Run the API IDOR suite as app_tenant
        env:
          DATABASE_URL: postgresql://app_tenant:${{ env.APP_TENANT_PW }}@localhost:5432/mga_idor_test?sslmode=disable
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mga_idor_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: node scripts/api-idor-verify.js
